<!-- Zana mark, small size (below ~24px).
     Per the brand spec: the two solder pads are dropped and the hex stroke is
     thinned, because at that size the pads and the trace close up against the
     hex wall and the whole thing reads as a filled blob. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img" aria-label="Zana">
  <polygon points="58,32 45,54.52 19,54.52 6,32 19,9.48 45,9.48"
           fill="none" stroke="#f2a72c" stroke-width="3.6"
           stroke-linejoin="round"/>
  <polyline points="22.5,22.5 41.5,22.5 22.5,41.5 41.5,41.5"
            fill="none" stroke="#f7f4ec" stroke-width="4.2"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
