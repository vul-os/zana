<!-- Favicon: the small-size mark on the near-black page ground.
     A tab favicon renders at 16px, so this uses the sub-24px variant from the
     brand spec — no solder pads, thinned hex stroke. The rounded square is the
     page ground behind the mark, not a fill of the hex: the hex itself is
     still outline only. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Zana">
  <rect width="64" height="64" rx="13" fill="#0a0b0d"/>
  <polygon points="53,32 41.5,51.92 18.5,51.92 7,32 18.5,12.08 41.5,12.08"
           fill="none" stroke="#f2a72c" stroke-width="4"
           stroke-linejoin="round"/>
  <polyline points="24,24 40,24 24,40 40,40"
            fill="none" stroke="#f7f4ec" stroke-width="4.4"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
