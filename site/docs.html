<script src="./assets/vendor/marked.umd.js"></script>
<script src="./assets/zana.js" defer></script>
<script>
/* Zana docs viewer. The DOCS array is the nav contract: tests/test_site.py
   parses it out of this file and fails if it drifts from the sidebar above or
   from the files on disk, so keep the three fields and keep one data-slug row
   per entry. */
const DOCS = [
  {"slug":"overview","title":"Overview","path":"./docs/overview.md"},
  {"slug":"getting-started","title":"Getting started","path":"./docs/getting-started.md"},
  {"slug":"mower","title":"The mower design","path":"./docs/mower-design.md"},
  {"slug":"aql","title":"Runs on Aql","path":"./docs/aql.md"}
];

const bySlug = Object.fromEntries(DOCS.map(d => [d.slug, d]));
const content = document.getElementById("content");
const crumb = document.getElementById("crumb");

if (window.marked && marked.setOptions) marked.setOptions({ gfm: true, breaks: false });

function setActive(slug) {
  document.querySelectorAll(".docs-nav a").forEach(a =>
    a.classList.toggle("active", a.dataset.slug === slug));
}

// A copy button per code block. navigator.clipboard is undefined on insecure
// origins — and this page is meant to work opened straight off disk — so a
// failure is swallowed rather than thrown into the console.
function addCopyButtons() {
  content.querySelectorAll("pre").forEach(pre => {
    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.type = "button";
    btn.textContent = "copy";
    btn.addEventListener("click", () => {
      navigator.clipboard?.writeText(pre.querySelector("code")?.textContent ?? pre.textContent).then(
        () => { btn.textContent = "copied"; setTimeout(() => { btn.textContent = "copy"; }, 1400); },
        () => {}
      );
    });
    pre.appendChild(btn);
  });
}

async function load(slug) {
  const doc = bySlug[slug] || DOCS[0];
  setActive(doc.slug);
  crumb.textContent = doc.title;
  document.title = "Zana — " + doc.title;
  content.innerHTML = "Loading…";
  try {
    const res = await fetch(doc.path, { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    content.innerHTML = marked.parse(await res.text());
    content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
    addCopyButtons();
    window.scrollTo({ top: 0 });
  } catch (err) {
    content.innerHTML = '<div class="docs-error">Could not load <code>' +
      doc.path + "</code> — " + err.message + "</div>";
  }
}

const current = () => (location.hash || "").replace("#", "") || DOCS[0].slug;
window.addEventListener("hashchange", () => load(current()));
load(current());
</script>
